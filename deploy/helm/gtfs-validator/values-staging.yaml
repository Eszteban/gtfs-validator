# Staging environment overrides for gtfs-validator
replicaCount: 1

image:
  tag: "1.0.0-staging"
  pullPolicy: Always

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false

env:
  DATABASE_URL: "sqlite:////app/data/gtfs_validator_staging.db"
  UPLOAD_DIR: "/app/uploads"
  SQL_ECHO: "true"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: staging-gtfs.szte.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

